allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': false
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  oxc-resolver: true
  prisma: true
  sharp: true
  unrs-resolver: true
peerDependencyRules:
  allowedVersions:
    react: '>=19.0.0'
minimumReleaseAgeExclude:
  - knip@6.16.1
  - '@clerk/backend@3.6.1'
  - '@clerk/nextjs@7.5.1'
  - '@clerk/react@6.9.0'
  - '@clerk/shared@4.17.0'
